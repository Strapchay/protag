<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Aion Kernel dashboard preview</title>
  <desc id="desc">Terminal dashboard showing the Architect Chat tab, agent output, input box, and status bar.</desc>
  <rect width="1200" height="400" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="3" fill="#d93a30"/>

  <text x="3" y="16" font-family="monospace" font-size="15" font-weight="700" fill="#00b9ff">AION KERNEL DASHBOARD</text>

  <g font-family="monospace" font-size="14">
    <rect x="6" y="20" width="142" height="18" fill="#06a8e9"/>
    <text x="14" y="34" fill="#ffffff" font-weight="700">Architect Chat</text>

    <rect x="157" y="20" width="108" height="18" fill="#242424"/>
    <text x="166" y="34" fill="#9a9a9a">Operations</text>

    <rect x="275" y="20" width="44" height="18" fill="#242424"/>
    <text x="286" y="34" fill="#9a9a9a">DAG</text>

    <rect x="328" y="20" width="117" height="18" fill="#242424"/>
    <text x="337" y="34" fill="#9a9a9a">Context Hub</text>

    <rect x="455" y="20" width="72" height="18" fill="#242424"/>
    <text x="466" y="34" fill="#9a9a9a">Agents</text>
  </g>

  <rect x="7" y="47" width="1189" height="252" rx="2" fill="#000000" stroke="#262626"/>
  <line x1="12" y1="102" x2="1156" y2="102" stroke="#2d2d2d"/>
  <line x1="12" y1="174" x2="1156" y2="174" stroke="#2d2d2d"/>
  <line x1="12" y1="246" x2="1156" y2="246" stroke="#2d2d2d"/>
  <rect x="1178" y="55" width="1" height="225" fill="#575757"/>
  <rect x="1174" y="272" width="9" height="18" fill="#f04aa4"/>

  <g font-family="monospace" font-size="15">
    <text x="193" y="90" fill="#777777" font-style="italic">[... 24 more lines. Press Ctrl+X to expand.]</text>

    <text x="13" y="143" fill="#ffd400" font-weight="700">agent-backup:</text>
    <text x="141" y="143" fill="#ffb000" font-weight="700">Run shell: echo $AION_AGENT_ID</text>
    <text x="171" y="160" fill="#6e6e6e" font-style="italic">[operation collapsed. Press Ctrl+X to expand.]</text>

    <text x="13" y="215" fill="#ffd400" font-weight="700">agent-backup:</text>
    <text x="141" y="215" fill="#a7a7a7">agent-backup</text>
  </g>

  <rect x="7" y="317" width="1189" height="37" rx="3" fill="#000000" stroke="#00aeef"/>
  <rect x="12" y="326" width="621" height="19" fill="#31383a"/>
  <text x="12" y="342" font-family="monospace" font-size="15" fill="#858585">Type a message for the Solution Architect... (Press 'ESC' to unfocus)</text>

  <text x="3" y="376" font-family="monospace" font-size="18" fill="#00b9ff">::</text>
  <text x="31" y="376" font-family="monospace" font-size="15" fill="#a8a8a8">Domain Agent is thinking...</text>
</svg>
