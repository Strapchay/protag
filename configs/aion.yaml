# Aion-Kernel Configuration
# See docs/current/implementation_arch.md for architecture details.

orchestrator:
  # gRPC listen address, sourced from .env via AION_ORCHESTRATOR_HOST/PORT
  listen_addr: "${AION_ORCHESTRATOR_HOST}:${AION_ORCHESTRATOR_PORT}"
  # Path to DAG FlatBuffer file (relative to project root)
  dag_file: "${AION_DAG_FILE}"
  # Path to WAL file
  wal_file: "${AION_WAL_FILE}"
  # Maximum number of active DAG nodes before rejecting SPLIT/INJECT
  max_active_nodes: ${AION_MAX_ACTIVE_NODES}
  # Maximum ms between WAL flushes (group commit deadline)
  flush_deadline_ms: ${AION_FLUSH_DEADLINE_MS}

health:
  # Seconds without heartbeat before agent is considered dead
  heartbeat_timeout_sec: ${AION_HEARTBEAT_TIMEOUT_SEC}
  # Seconds without progress (lock/write/update) before agent is killed
  progress_timeout_sec: ${AION_PROGRESS_TIMEOUT_SEC}
  # Seconds an external runtime pulse may go stale before progress timeout applies
  external_activity_stale_timeout_sec: ${AION_EXTERNAL_ACTIVITY_STALE_TIMEOUT_SEC}
  # Maximum seconds an agent can be shielded by one continuous external wait
  external_activity_max_duration_sec: ${AION_EXTERNAL_ACTIVITY_MAX_DURATION_SEC}
  # Seconds allowed for Coordinator planner process startup during /build-spec
  coordinator_planner_start_timeout_sec: ${AION_COORDINATOR_PLANNER_START_TIMEOUT_SEC}
  # Seconds allowed after prompt dispatch before Coordinator must hit gateway
  coordinator_planner_first_request_timeout_sec: ${AION_COORDINATOR_PLANNER_FIRST_REQUEST_TIMEOUT_SEC}
  # Seconds allowed after prompt dispatch for Coordinator to write the plan artifact
  coordinator_planner_artifact_timeout_sec: ${AION_COORDINATOR_PLANNER_ARTIFACT_TIMEOUT_SEC}

execution:
  # Request-control mode. "gateway" routes Pi provider traffic through Aion.
  mode: ${AION_EXECUTION_MODE}
  # Maximum concurrent upstream inference requests admitted by the gateway
  max_concurrent_requests: ${AION_EXECUTION_MAX_CONCURRENT_REQUESTS}
  # Seconds an agent may wait in the FIFO gateway queue
  request_queue_timeout_sec: ${AION_EXECUTION_REQUEST_QUEUE_TIMEOUT_SEC}

inference_gateway:
  # Local provider-compatible proxy used by the Pi provider extension
  enabled: ${AION_INFERENCE_GATEWAY_ENABLED}
  # HTTP listener for OpenAI-compatible and Anthropic-compatible requests
  listen_addr: ${AION_INFERENCE_GATEWAY_LISTEN_ADDR}
  # Base URL injected into Pi provider overrides
  public_base_url: ${AION_INFERENCE_GATEWAY_URL}
  # Optional local gateway key used only between Pi agents and the kernel
  gateway_key: ${AION_INFERENCE_GATEWAY_KEY}
  # Optional fallback profile when an agent does not pass a target profile
  target_profile: ${AION_INFERENCE_GATEWAY_TARGET_PROFILE}
  # Retry only failures observed before response bytes are returned to Pi
  max_retries: ${AION_INFERENCE_GATEWAY_MAX_RETRIES}
  # Initial exponential retry delay in milliseconds
  retry_base_delay_ms: ${AION_INFERENCE_GATEWAY_RETRY_BASE_DELAY_MS}
  # Maximum retry and Retry-After delay in milliseconds
  retry_max_delay_ms: ${AION_INFERENCE_GATEWAY_RETRY_MAX_DELAY_MS}
  # Total seconds an admitted upstream request may hold gateway capacity
  upstream_timeout_sec: ${AION_INFERENCE_GATEWAY_UPSTREAM_TIMEOUT_SEC}

isolation:
  # Mandatory domain-agent sandbox backend; no production passthrough exists
  backend: "${AION_ISOLATION_BACKEND}"
  # Host directory for ephemeral per-generation workspace metadata
  runtime_base: "${AION_ISOLATION_RUNTIME_BASE}"
  # "shared" reaches the local gateway; "isolated" disables networking
  network: "${AION_ISOLATION_NETWORK}"

cgroups:
  # Enable cgroup resource limits (requires Linux + permissions)
  enabled: ${AION_CGROUPS_ENABLED}
  # Cgroup management mode for the installed runtime
  mode: ${AION_CGROUPS_MODE}
  # Base cgroup subtree created by the install step or delegated runtime
  base_path: ${AION_CGROUPS_BASE_PATH}
  # Memory limit per agent process group (MB)
  memory_max_mb: ${AION_CGROUPS_MEMORY_MAX_MB}
  # Max PIDs per agent process group
  pids_max: ${AION_CGROUPS_PIDS_MAX}

inference:
  # Model Profiles allow reusing configurations and environment variables
  models:
    oracle:
      provider: "${AION_PROFILE_ORACLE_PROVIDER}"
      model: "${AION_PROFILE_ORACLE_MODEL}"
      endpoint: "${AION_PROFILE_ORACLE_ENDPOINT}"
      env:
        ${AION_PROFILE_ORACLE_ENV_KEY}: "${AION_PROFILE_ORACLE_API_KEY}"
    forge:
      provider: "${AION_PROFILE_FORGE_PROVIDER}"
      model: "${AION_PROFILE_FORGE_MODEL}"
      endpoint: "${AION_PROFILE_FORGE_ENDPOINT}"
      env:
        ${AION_PROFILE_FORGE_ENV_KEY}: "${AION_PROFILE_FORGE_API_KEY}"
    glimmer:
      provider: "${AION_PROFILE_GLIMMER_PROVIDER}"
      model: "${AION_PROFILE_GLIMMER_MODEL}"
      endpoint: "${AION_PROFILE_GLIMMER_ENDPOINT}"
      env:
        ${AION_PROFILE_GLIMMER_ACCOUNT_ENV_KEY}: "${AION_PROFILE_GLIMMER_ACCOUNT_ID}"
        ${AION_PROFILE_GLIMMER_API_KEY_ENV_KEY}: "${AION_PROFILE_GLIMMER_API_KEY}"
    ember:
      provider: "${AION_PROFILE_EMBER_PROVIDER}"
      model: "${AION_PROFILE_EMBER_MODEL}"
      endpoint: "${AION_PROFILE_EMBER_ENDPOINT}"
      env:
        ${AION_PROFILE_EMBER_ENV_KEY}: "${AION_PROFILE_EMBER_API_KEY}"
    lyric:
      provider: "${AION_PROFILE_LYRIC_PROVIDER}"
      model: "${AION_PROFILE_LYRIC_MODEL}"
      endpoint: "${AION_PROFILE_LYRIC_ENDPOINT}"
      env:
        ${AION_PROFILE_LYRIC_ENV_KEY}: "${AION_PROFILE_LYRIC_API_KEY}"

  coordinator:
    use_profile: "${AION_COORDINATOR_PROFILE}"
  domain_agents:
    use_profile: "${AION_DOMAIN_AGENTS_PROFILE}"
  fallback:
    provider: "${AION_PROFILE_HARBOR_PROVIDER}"
    model: "${AION_PROFILE_HARBOR_MODEL}"
    endpoint: "${AION_PROFILE_HARBOR_ENDPOINT}"

agents:
  # Directory for Pi Agent session files
  session_dir: "${AION_AGENT_SESSION_DIR}"
  # Maximum concurrent domain agents
  max_agents: ${AION_MAX_AGENTS}
  # Path to the Pi binary
  command_path: "${AION_AGENT_COMMAND_PATH}"
  # Paths to Pi skills/extensions
  skill_paths:
    - "${AION_AGENT_SKILL_PATH}"
  extension_paths:
    - "${AION_PI_GATEWAY_EXTENSION_PATH}"
  # Files that cannot be locked directly — must use Utility Agent
  shared_files:
    - "go.mod"
    - "go.sum"

memory:
  # Enable semantic memory (Chromem-DB)
  enabled: ${AION_MEMORY_ENABLED}
  # Enable read queries during agent ORIENT phase
  read_enabled: ${AION_MEMORY_READ_ENABLED}
  # Minimum similarity threshold for memory retrieval
  relevance_threshold: ${AION_MEMORY_RELEVANCE_THRESHOLD}
